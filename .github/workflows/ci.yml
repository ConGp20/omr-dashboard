# Runs on every push and pull request: the same checks the project is verified
# with locally — backend tests + dependency audit, frontend typecheck + build +
# audit, and a real build of both Docker images from a clean checkout (the
# step that once broke because a .dockerignore was missing).
name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend — tests & audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest pip-audit
      - name: Tests (demo + real-mode units)
        run: OMR_DASHBOARD_DEMO=true pytest
      - name: Known vulnerabilities
        run: pip-audit -r requirements.txt --no-deps

  frontend:
    name: Frontend — typecheck, build & audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Known vulnerabilities
        run: npm audit --audit-level=high

  images:
    name: Docker images build from a clean checkout
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Backend image (includes the shorewall apt layer)
        run: docker build backend
      - name: Frontend image (standalone Next build)
        run: docker build frontend
