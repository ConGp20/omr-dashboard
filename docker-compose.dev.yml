# OMR Dashboard — development compose (demo mode, hot reload).
#
#   docker compose -f docker-compose.dev.yml up
#
# Runs the backend in demo mode (synthetic data, no live VPS needed) and the
# frontend dev server with hot reload. Open http://localhost:3000.
services:
  backend:
    build: ./backend
    environment:
      OMR_DASHBOARD_DEMO: "true"
      OMR_DASHBOARD_DATA_DIR: "/tmp/omr-dashboard"
    command: >
      uvicorn omr_dashboard_api:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    working_dir: /app
    depends_on:
      - backend
    environment:
      BACKEND_URL: "http://backend:8000"
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
